name: dependency-vulnerability-scan
# OWASP dependency-check against the NVD. Weekly and on demand, kept out of the push build because
# the NVD download is slow. Needs a free NVD API key stored as the NVD_API_KEY repository secret.
on:
  schedule: [{ cron: "17 3 * * 1" }]   # Mondays 03:17 UTC
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: OWASP dependency-check (fails on CVSS >= 7)
        run: mvn -B -P security-scan verify -DskipTests -Djacoco.skip=true -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
