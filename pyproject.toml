[project]
name = "tamper-evident-audit-log"
version = "1.0.0"
description = "Append-only, hash-chained audit log service with redaction, retention and verifiable export."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: imports, B: bugbear, UP: modern syntax, S: bandit security rules
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of tests

[tool.pytest.ini_options]
testpaths = ["tests"]
