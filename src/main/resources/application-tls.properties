# Direct TLS on the service (use when TLS is not terminated at a load balancer).
# Run with --spring.profiles.active=tls (combine with your user/key configuration).
# Spring Security adds Strict-Transport-Security (HSTS) to every HTTPS response.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${AUDIT_TLS_KEYSTORE:}
server.ssl.key-store-password=${AUDIT_TLS_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.http2.enabled=true
