spring.application.name=tamper-evident-audit-log
# SQLite file; WAL lets readers run alongside the single writer; writers wait up to 5 s for the lock
spring.datasource.url=jdbc:sqlite:${AUDIT_DB_PATH:audit.db}?journal_mode=WAL&busy_timeout=5000&secure_delete=true
spring.datasource.hikari.maximum-pool-size=4
# Reject unknown JSON fields (e.g. a caller-supplied "timestamp")
spring.jackson.deserialization.fail-on-unknown-properties=true
# Records younger than the minimum (SEC 17a-4: 6 years) can never be archived
audit.retention-min-days=${AUDIT_RETENTION_MIN_DAYS:2190}
audit.retention-days=${AUDIT_RETENTION_DAYS:2190}
# Server secret for record MACs (>= 32 bytes). No default: the service refuses to start without it.
audit.hmac-key=${AUDIT_HMAC_KEY:}
# Rotation: give the new key a new id and move the old one to the retired list (id=secret, comma separated)
audit.hmac-key-id=${AUDIT_HMAC_KEY_ID:k1}
audit.hmac-retired-keys=${AUDIT_HMAC_RETIRED_KEYS:}
# Request guards: bodies over this size get 413; more than this many requests per minute per client IP get 429
audit.max-request-bytes=${AUDIT_MAX_REQUEST_BYTES:65536}
audit.rate-limit.per-minute=${AUDIT_RATE_LIMIT_PER_MINUTE:600}
# memory = per instance; database = one shared limit across all instances (use when running more than one)
audit.rate-limit.store=${AUDIT_RATE_LIMIT_STORE:memory}
# Load balancer / reverse proxy IPs whose X-Forwarded-For header is trusted (comma list; empty = none)
audit.trusted-proxies=${AUDIT_TRUSTED_PROXIES:}
# Ed25519 key pair for signing export bundles and checkpoints (base64 PKCS#8 / X.509). Required.
audit.signing.private-key=${AUDIT_SIGNING_PRIVATE_KEY:}
audit.signing.public-key=${AUDIT_SIGNING_PUBLIC_KEY:}
# Signed head checkpoints: put this file on separate append-only (WORM) storage
audit.checkpoint.file=${AUDIT_CHECKPOINT_FILE:audit-checkpoints.jsonl}
audit.checkpoint.interval-ms=${AUDIT_CHECKPOINT_INTERVAL_MS:3600000}
# AES-256 key (base64, 32 bytes) encrypting the sensitive fields below at rest. Required.
audit.encryption-key=${AUDIT_ENCRYPTION_KEY:}
# Sensitive payload fields: encrypted at rest, masked for the READER role (COMPLIANCE and ADMIN see them)
audit.sensitive-fields=${AUDIT_SENSITIVE_FIELDS:ssn,accountNumber,taxId,dateOfBirth}
# Authentication: jwt = OAuth2 access tokens from your OIDC identity provider (production),
# basic = configured users, both = either. jwt needs issuer + jwk-set-uri: no defaults, so the
# service refuses to start until they are configured.
audit.security.auth-mode=${AUDIT_AUTH_MODE:jwt}
audit.security.jwt.issuer=${AUDIT_JWT_ISSUER:}
audit.security.jwt.audience=${AUDIT_JWT_AUDIENCE:audit-log}
audit.security.jwt.jwk-set-uri=${AUDIT_JWT_JWK_SET_URI:}
audit.security.jwt.max-lifetime-minutes=${AUDIT_JWT_MAX_LIFETIME_MINUTES:60}
# API users: none by default, so the service refuses to start until they are configured.
# Run with --spring.profiles.active=dev for local demo users (see application-dev.properties).
springdoc.swagger-ui.path=/docs
# Swagger UI and the API schema are off by default (prod); the dev profile turns them on
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Actuator: health is public (status only, with a DB check); info and metrics need ADMIN
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
# Structured JSON logs (Elastic Common Schema) for log aggregation; each line carries user.name and request.id
logging.structured.format.console=ecs
