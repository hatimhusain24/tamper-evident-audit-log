spring.application.name=tamper-evident-audit-log
# SQLite file; WAL lets readers run alongside the single writer; writers wait up to 5 s for the lock
spring.datasource.url=jdbc:sqlite:${AUDIT_DB_PATH:audit.db}?journal_mode=WAL&busy_timeout=5000&secure_delete=true
spring.datasource.hikari.maximum-pool-size=4
# Reject unknown JSON fields (e.g. a caller-supplied "timestamp")
spring.jackson.deserialization.fail-on-unknown-properties=true
# Records younger than the minimum (SEC 17a-4: 6 years) can never be archived
audit.retention-min-days=${AUDIT_RETENTION_MIN_DAYS:2190}
audit.retention-days=${AUDIT_RETENTION_DAYS:2190}
# Server secret for record MACs (>= 32 bytes). No default: the service refuses to start without it.
audit.hmac-key=${AUDIT_HMAC_KEY:}
# Request guards: bodies over this size get 413; more than this many requests per minute per client IP get 429
audit.max-request-bytes=${AUDIT_MAX_REQUEST_BYTES:65536}
audit.rate-limit.per-minute=${AUDIT_RATE_LIMIT_PER_MINUTE:600}
# Load balancer / reverse proxy IPs whose X-Forwarded-For header is trusted (comma list; empty = none)
audit.trusted-proxies=${AUDIT_TRUSTED_PROXIES:}
# Payload fields shown masked to READER role (COMPLIANCE and ADMIN see them in full)
audit.sensitive-fields=${AUDIT_SENSITIVE_FIELDS:ssn,accountNumber,taxId,dateOfBirth}
# API users: none by default, so the service refuses to start until they are configured.
# Run with --spring.profiles.active=dev for local demo users (see application-dev.properties).
springdoc.swagger-ui.path=/docs
# Swagger UI and the API schema are off by default (prod); the dev profile turns them on
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Actuator: health is public (status only, with a DB check); info and metrics need ADMIN
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
