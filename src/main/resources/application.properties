spring.application.name=tamper-evident-audit-log
# SQLite file; WAL lets readers run alongside the single writer, IMMEDIATE takes the write lock up front
spring.datasource.url=jdbc:sqlite:${AUDIT_DB_PATH:audit.db}?journal_mode=WAL&busy_timeout=5000&transaction_mode=IMMEDIATE&secure_delete=true
spring.datasource.hikari.maximum-pool-size=4
# Reject unknown JSON fields (e.g. a caller-supplied "timestamp")
spring.jackson.deserialization.fail-on-unknown-properties=true
# Records younger than the minimum (SEC 17a-4: 6 years) can never be archived
audit.retention-min-days=${AUDIT_RETENTION_MIN_DAYS:2190}
audit.retention-days=${AUDIT_RETENTION_DAYS:2190}
# Payload fields shown masked to READER role (COMPLIANCE and ADMIN see them in full)
audit.sensitive-fields=${AUDIT_SENSITIVE_FIELDS:ssn,accountNumber,taxId,dateOfBirth}
# API users: none by default, so the service refuses to start until they are configured.
# Run with --spring.profiles.active=dev for local demo users (see application-dev.properties).
springdoc.swagger-ui.path=/docs
spring.mvc.problemdetails.enabled=true
